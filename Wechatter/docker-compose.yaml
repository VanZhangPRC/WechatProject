name: wechatter
networks:
  wechatter-networks:
services:
  searxng:
    container_name: searxng
    image: searxng/searxng:2026.9.2-05cd77f71
    environment:
      - TZ=Asia/Shanghai
    ports:
      - 18080:8080
    volumes:
      - /workspace/searxng/config/:/etc/searxng/
      - /workspace/searxng/data/:/var/cache/searxng/
    restart: unless-stopped
    networks:
      - wechatter-networks
    deploy:
      resources:
        limits:
          memory: 256m
#  mysql:
