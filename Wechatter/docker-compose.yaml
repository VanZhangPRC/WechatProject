  wechatter:
    image: wechatter:v1.0
    container_name: wechatter
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      TZ: Asia/Shanghai
      SERVER_HOST: wechatter.zhfan.online
      APIHZ_ID: 10020153
      APIHZ_KEY: ${APIHZ_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      WECHAT_APP_ID: ${WECHAT_APP_ID}
      WECHAT_SECRET: ${WECHAT_SECRET}
      WECHAT_TOKEN: ${WECHAT_TOKEN}
      WECHAT_OPENID: gh_0cd897bfcc63
      SPRING_DATASOURCE_USERNAME: wechatter
      SPRING_DATASOURCE_PASSWORD: ${WECHATTER_DB_PASSWORD}
      SEARXNG_HOST: searxng:8080
    ports:
      - 80:8080
    volumes:
      - /workspace/wechatter/data:/wechatter/data
    networks:
      - wechatter-networks
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
    depends_on:
      - searxng
#      - mysql
