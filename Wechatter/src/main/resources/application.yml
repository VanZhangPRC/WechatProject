server:
  port: 8080

spring:
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash
    mcp:
      server:
        name: Wechatter-Reminder-MCP-Server
        version: 1.0.0
        type: SYNC
        instructions: "提供提醒管理工具：新增提醒、查询提醒、取消提醒、获取当前时间。供第三方客户端通过 MCP 协议调用。"
        protocol: STREAMABLE
  datasource:
    url: jdbc:h2:file:./data/wechatter;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console

wechat:
  # 公众号 AppID（通过命令行或环境变量 WECHAT_APP_ID 注入）
  app-id: ${WECHAT_APP_ID:}
  # 公众号 AppSecret（通过命令行或环境变量 WECHAT_SECRET 注入）
  secret: ${WECHAT_SECRET:}
  # 服务器配置的 Token（通过命令行或环境变量 WECHAT_TOKEN 注入）
  token: ${WECHAT_TOKEN:}
  # 模版消息 ID（通过命令行或环境变量 WECHAT_TEMPLATE_ID 注入）
  template-id: ${WECHAT_TEMPLATE_ID:}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl